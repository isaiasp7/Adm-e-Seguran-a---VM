# Copie este arquivo para a pasta conf do Nginx na VM 1.
# Se o IP da VM 2 mudar, altere as DUAS linhas marcadas abaixo.
# O IP da VM 1 é informado na interface React; não aparece neste arquivo.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream node_a {
        server 127.0.0.1:3000;
    }

    upstream node_b {
        server 192.168.56.108:3000; # IP DA VM 2 (1 de 2)
    }

    upstream biblioteca_nodes {
        server 127.0.0.1:3000;
        server 192.168.56.108:3000; # IP DA VM 2 (2 de 2)
    }

    server {
        listen 80 default_server;
        server_name _;

        # O React roda no host, em outra origem.
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;

        # Agregação: o NODE-A reúne os livros de A e B.
        location = /biblioteca/todos {
            proxy_pass http://node_a/agregador/todos;
        }

        # A interface chama exatamente /balanceamento/ e espera o nó respondente.
        location = /balanceamento/ {
            proxy_pass http://biblioteca_nodes/health;
        }

        # Consulta cada nó separadamente: /servidor-a/livros e /servidor-b/livros.
        location /servidor-a/ {
            proxy_pass http://node_a/;
        }

        location /servidor-b/ {
            proxy_pass http://node_b/;
        }

        # Também preserva /balanceamento/livros.
        location /balanceamento/ {
            proxy_pass http://biblioteca_nodes/;
        }
    }
}
